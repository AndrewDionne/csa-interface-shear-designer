name: Mac runner policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: AndrewDionne/reposnapshot/.github/workflows/mac-runner-policy.yml@435fb64f660104f3f4372cc8fcb0e97eed028ea5
    with:
      runner_label: csa-shear-macos
