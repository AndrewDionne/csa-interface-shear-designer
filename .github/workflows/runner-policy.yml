name: Mac runner policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - csa-shear-macos
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce trusted-Mac development policy
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow_root = Path(".github/workflows")
          hosted = re.compile(
              r"(?:runs-on:\s*|^\s*-\s*)(ubuntu-latest|windows-latest|macos-(?:latest|\d+))\s*$",
              re.MULTILINE,
          )
          cache = re.compile(
              r"actions/" + r"cache@" + r"|^\s+cache:\s*", re.MULTILINE
          )
          repository_write = re.compile(r"^\s*contents:\s*write\s*$", re.MULTILINE)
          repository_mutation = re.compile(
              r"^\s*(?:git\s+push\b|git\s+rm\b|rm\b[^\n]*(?:\.github/workflows|GITHUB_WORKFLOW))",
              re.MULTILINE,
          )
          failures = []
          workflows = sorted((*workflow_root.glob("*.yml"), *workflow_root.glob("*.yaml")))

          for path in workflows:
              source = path.read_text(encoding="utf-8")
              matches = hosted.findall(source)
              if matches:
                  failures.append(
                      f"{path}: hosted runner label(s) are not allowed for development: "
                      + ", ".join(sorted(set(matches)))
                  )
              if cache.search(source):
                  failures.append(
                      f"{path}: GitHub-hosted dependency caches are disabled on the free-tier baseline"
                  )
              if repository_write.search(source) or repository_mutation.search(source):
                  failures.append(
                      f"{path}: validation workflows must be read-only and must not rewrite or delete workflows"
                  )

          if failures:
              for failure in failures:
                  print(f"ERROR: {failure}")
              raise SystemExit(1)

          print(f"Trusted Mac runner policy: OK ({len(workflows)} workflows)")
          PY
